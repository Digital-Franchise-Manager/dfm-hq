name: DFM Quality Checks
on:
  push:
    branches: [main, "security/**", "feature/**"]
  pull_request:
    branches: [main, "feature/**"]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@12.2.2
      - run: npm ci --no-audit --no-fund
      - run: npm run check

  database-persistence:
    name: DRL private persistence SQL tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: dfm_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d dfm_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: dfm_test
    steps:
      - uses: actions/checkout@v7
      - name: Create minimal Supabase role fixtures
        run: |
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE anon NOLOGIN"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE authenticated NOLOGIN"
          psql -v ON_ERROR_STOP=1 -c "CREATE ROLE service_role NOLOGIN"
          psql -v ON_ERROR_STOP=1 -c "CREATE SCHEMA auth"
          psql -v ON_ERROR_STOP=1 -c "CREATE TABLE auth.users (id uuid PRIMARY KEY)"
      - name: Apply private DRL schema draft
        run: psql -v ON_ERROR_STOP=1 -f supabase/drafts/drl_mode_persistence.sql
      - name: Apply server-only DRL RPC draft
        run: psql -v ON_ERROR_STOP=1 -f supabase/drafts/drl_mode_persistence_rpc.sql
      - name: Run DRL persistence security assertions
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/database/drl_mode_persistence.sql
      - name: Run DRL persistence integration tests
        run: psql -v ON_ERROR_STOP=1 -f supabase/tests/database/drl_mode_persistence_integration.sql

  drl-mode-engines:
    name: DRL Classic and Draft engine unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run independent mode engine tests
        run: python -m unittest discover -s backend/dfm/sports/drl/tests -t . -p "test_*.py"
      - name: Run player identity reconciliation tests
        run: python -m unittest discover -s backend/dfm/sports/drl/nrl/extractor/tests -p "test_*.py"
