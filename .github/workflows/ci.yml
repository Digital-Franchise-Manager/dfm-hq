name: DFM Quality Checks

on:
  push:
    branches:
      - main
      - "security/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Pin npm
        run: npm install --global npm@12.2.2

      - name: Install exact locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify TypeScript, tests and production build
        run: npm run check
