name: DFM Quality Checks
on:
  push:
    branches: [main, "security/**", "feature/**"]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm install --global npm@12.2.2
      - run: npm ci --no-audit --no-fund
      - run: npm run check
  drl-mode-engines:
    name: DRL Classic and Draft engine unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run independent mode engine tests
        run: python -m unittest discover -s backend/dfm/drl/tests -t . -p "test_*.py"
