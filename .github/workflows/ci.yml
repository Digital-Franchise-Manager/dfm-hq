name: DFM Quality Checks

on:
  push:
    branches:
      - main
      - "security/**"
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    name: Typecheck, test and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js 24 LTS
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Pin npm
        run: npm install --global npm@12.2.2

      - name: Regenerate exact workspace lockfile
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Install locked dependencies
        run: npm ci --no-audit --no-fund

      - name: Verify TypeScript, tests and production build
        run: npm run check

      - name: Commit lockfile after successful verification
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/security/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          cp package-lock.json "${RUNNER_TEMP}/dfm-package-lock.json"
          gh auth setup-git
          git fetch origin "${GITHUB_REF_NAME}"
          git reset --hard FETCH_HEAD
          cp "${RUNNER_TEMP}/dfm-package-lock.json" package-lock.json
          git add package-lock.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "chore: refresh reproducible workspace lockfile"
          git push origin "HEAD:${GITHUB_REF_NAME}"
